{% load elite %}<div class="dk-fields"><div class="ea-field"><label for="pc{{ sfx }}">{% t "Document number" "رقم المستند" %}</label><input id="pc{{ sfx }}" name="code" value="{{ proc.code }}" maxlength="30" dir="ltr" required placeholder="EA-OPS-PROC-01"></div><div class="ea-field"><label for="pk{{ sfx }}">{% t "Type" "النوع" %}</label><select id="pk{{ sfx }}" name="kind">{% for v, l in kinds %}<option value="{{ v }}"{% if v == proc.kind %} selected{% endif %}>{% if lang == "ar" %}{% if v == "procedure" %}إجراء{% elif v == "form" %}نموذج{% elif v == "policy" %}سياسة{% else %}مرجع{% endif %}{% else %}{{ l }}{% endif %}</option>{% endfor %}</select></div><div class="ea-field"><label for="pt{{ sfx }}">{% t "Title" "العنوان" %}</label><input id="pt{{ sfx }}" name="title" value="{{ proc.title }}" maxlength="200" required></div><div class="ea-field"><label for="pa{{ sfx }}">{% t "Title in Arabic" "العنوان بالعربية" %}</label><input id="pa{{ sfx }}" name="title_ar" value="{{ proc.title_ar }}" maxlength="200" dir="rtl"></div><div class="ea-field"><label for="po{{ sfx }}">{% t "Owner" "المالك" %}</label><select id="po{{ sfx }}" name="owner">{% for u in staff %}<option value="{{ u.pk }}"{% if u.pk == proc.owner_id %} selected{% endif %}>{{ u.full_name }}</option>{% endfor %}</select></div><fieldset class="ea-field dk-wide"><legend>{% t "Who must read it (none ticked = all staff)" "من يجب أن يقرأه (بدون تحديد = كل الموظفين)" %}</legend><div class="dk-fields">{% for code, name in roles %}<label class="dk-check"><input type="checkbox" name="audience" value="{{ code }}"{% if code in proc.audience %} checked{% endif %}> {{ name }}</label>{% endfor %}</div></fieldset></div>
