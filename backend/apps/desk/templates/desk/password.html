{% extends "desk/base.html" %}{% load elite %}
{% block title %}{% t "Change password" "تغيير كلمة المرور" %}{% endblock %}
{% block content %}<div class="dk-head"><h1>{% t "Change password" "تغيير كلمة المرور" %}</h1></div>
<form method="post" class="dk-card dk-form" style="max-width:460px">{% csrf_token %}
{{ form.non_field_errors }}
<div class="ea-field"><label for="c">{% t "Current password" "كلمة المرور الحالية" %}</label><input id="c" type="password" name="current" autocomplete="current-password" required></div>
<div class="ea-field"><label for="n">{% t "New password (12 characters or more)" "كلمة المرور الجديدة (12 حرفاً أو أكثر)" %}</label><input id="n" type="password" name="new" autocomplete="new-password" minlength="12" required></div>
<div class="ea-field"><label for="r">{% t "New password again" "كلمة المرور الجديدة مرة أخرى" %}</label><input id="r" type="password" name="confirm" autocomplete="new-password" required></div>
<button class="ea-btn ea-btn--primary">{% t "Save" "حفظ" %}</button></form>
{% endblock %}
