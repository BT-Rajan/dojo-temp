{% load elite %}<form method="post" class="dk-form" style="margin-block-start:8px">{% csrf_token %}<input type="hidden" name="action" value="program">{% if pr %}<input type="hidden" name="program" value="{{ pr.pk }}">{% endif %}{% with s=pr.pk|default:"new" %}<div class="dk-fields">
<div class="ea-field"><label for="pn{{ s }}">{% t "Name (English)" "الاسم (بالإنجليزية)" %}</label><input id="pn{{ s }}" name="p_name" value="{{ pr.name }}" maxlength="120" required></div>
<div class="ea-field"><label for="pa{{ s }}">{% t "Name (Arabic)" "الاسم (بالعربية)" %}</label><input id="pa{{ s }}" name="p_name_ar" value="{{ pr.name_ar }}" maxlength="120" dir="rtl" required></div>
<div class="ea-field"><label for="pu{{ s }}">{% t "For" "لـ" %}</label><select id="pu{{ s }}" name="audience">{% for v, l in audiences %}<option value="{{ v }}"{% if pr and v == pr.audience %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
<div class="dk-row"><div class="ea-field"><label for="p1{{ s }}">{% t "Min age" "أقل عمر" %}</label><input id="p1{{ s }}" name="age_min" value="{{ pr.age_min|default_if_none:"" }}" inputmode="numeric" dir="ltr" style="max-width:90px"></div><div class="ea-field"><label for="p2{{ s }}">{% t "Max age" "أكبر عمر" %}</label><input id="p2{{ s }}" name="age_max" value="{{ pr.age_max|default_if_none:"" }}" inputmode="numeric" dir="ltr" style="max-width:90px"></div></div>
<fieldset class="ea-field dk-wide"><legend>{% t "Disciplines" "الرياضات" %}</legend><div class="dk-row">{% for d in disciplines %}<label class="dk-check"><input type="checkbox" name="disciplines" value="{{ d.pk }}"{% if pr and d in pr.disciplines.all %} checked{% endif %}> {% if lang == "ar" %}{{ d.name_ar }}{% else %}{{ d.name }}{% endif %}</label>{% endfor %}</div></fieldset>
<div class="ea-field dk-wide"><label for="pd{{ s }}">{% t "Description (optional)" "الوصف (اختياري)" %}</label><textarea id="pd{{ s }}" name="description" rows="2">{{ pr.description }}</textarea></div>
{% if pr %}<div class="ea-field"><label for="pi{{ s }}">{% t "Status" "الحالة" %}</label><select id="pi{{ s }}" name="is_active"><option value="1"{% if pr.is_active %} selected{% endif %}>{% t "Active" "نشط" %}</option><option value="0"{% if not pr.is_active %} selected{% endif %}>{% t "Inactive" "غير نشط" %}</option></select></div>{% endif %}
</div>{% endwith %}<button class="ea-btn ea-btn--primary ea-btn--sm">{% t "Save program" "حفظ البرنامج" %}</button></form>
