{% load elite %}<div class="dk-fields"><div class="ea-field"><label for="vn{{ p }}">{% t "Name" "الاسم" %}</label><input id="vn{{ p }}" name="name" maxlength="150" required value="{{ v.name|default:"" }}"></div><div class="ea-field"><label for="va{{ p }}">{% t "Name in Arabic" "الاسم بالعربية" %}</label><input id="va{{ p }}" name="name_ar" maxlength="150" dir="rtl" value="{{ v.name_ar|default:"" }}"></div><div class="ea-field"><label for="vt{{ p }}">{% t "Type" "النوع" %}</label><select id="vt{{ p }}" name="vendor_type"><option value="local"{% if v.vendor_type == "local" %} selected{% endif %}>{% t "Local" "محلي" %}</option><option value="international"{% if v.vendor_type == "international" %} selected{% endif %}>{% t "International" "دولي" %}</option></select></div><div class="ea-field"><label for="vc{{ p }}">{% t "Country" "الدولة" %}</label><input id="vc{{ p }}" name="country" maxlength="60" value="{{ v.country|default:"Kuwait" }}"></div><div class="ea-field"><label for="vp{{ p }}">{% t "Contact person" "الشخص المسؤول" %}</label><input id="vp{{ p }}" name="contact" maxlength="200" value="{{ v.contact|default:"" }}"></div><div class="ea-field"><label for="vh{{ p }}">{% t "Phone" "الهاتف" %}</label><input id="vh{{ p }}" name="phone" maxlength="30" dir="ltr" value="{{ v.phone|default:"" }}"></div><div class="ea-field"><label for="ve{{ p }}">{% t "Email" "البريد الإلكتروني" %}</label><input id="ve{{ p }}" name="email" type="email" maxlength="254" dir="ltr" value="{{ v.email|default:"" }}"></div><div class="ea-field"><label for="vu{{ p }}">{% t "Currency" "العملة" %}</label><input id="vu{{ p }}" name="currency" maxlength="3" dir="ltr" value="{{ v.currency|default:"KWD" }}"></div></div>
