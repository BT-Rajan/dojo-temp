{% load elite %}<div class="dk-fields"><div class="ea-field"><label for="vs{{ i }}">{% t "Size" "المقاس" %}</label><input id="vs{{ i }}" name="size" value="{{ v.size|default:"" }}" maxlength="20" required></div><div class="ea-field"><label for="vc{{ i }}">{% t "Colour" "اللون" %}</label><input id="vc{{ i }}" name="colour" value="{{ v.colour|default:"" }}" maxlength="30"></div><div class="ea-field"><label for="vb{{ i }}">{% t "Barcode" "الباركود" %}</label><input id="vb{{ i }}" name="barcode" value="{{ v.barcode|default:"" }}" dir="ltr" maxlength="40"></div><div class="ea-field"><label for="vk{{ i }}">{% t "Cost (KD)" "التكلفة (د.ك)" %}</label><input id="vk{{ i }}" name="cost" value="{{ v.cost|default:"" }}" inputmode="decimal" dir="ltr"></div><div class="ea-field"><label for="vp{{ i }}">{% t "Price for this size (blank = product price)" "سعر هذا المقاس (فارغ = سعر المنتج)" %}</label><input id="vp{{ i }}" name="retail_price" value="{{ v.retail_price|default_if_none:"" }}" inputmode="decimal" dir="ltr"></div><div class="ea-field"><label for="vr{{ i }}">{% t "Reorder level" "حد إعادة الطلب" %}</label><input id="vr{{ i }}" name="reorder_level" type="number" min="0" value="{{ v.reorder_level|default:0 }}" dir="ltr"></div><div class="ea-field"><label for="vm{{ i }}">{% t "Max level" "الحد الأقصى" %}</label><input id="vm{{ i }}" name="max_level" type="number" min="0" value="{{ v.max_level|default:0 }}" dir="ltr"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="is_active" value="1"{% if not v or v.is_active %} checked{% endif %}> {% t "Active" "فعال" %}</label></div>
