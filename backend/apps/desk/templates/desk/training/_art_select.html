{% load elite %}{% if arts|length > 1 %}<form method="get" class="dk-row" style="margin-block-end:12px">{% for k, v in request.GET.items %}{% if k != "art" %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endif %}{% endfor %}<label for="art-pick">{% t "Art" "الفن القتالي" %}</label><select id="art-pick" name="art" data-autosubmit>{% for a in arts %}<option value="{{ a.pk }}"{% if a.pk == art.pk %} selected{% endif %}>{% if lang == "ar" %}{{ a.name_ar }}{% else %}{{ a.name }}{% endif %}</option>{% endfor %}</select><noscript><button class="ea-btn ea-btn--ghost ea-btn--sm">{% t "Show" "عرض" %}</button></noscript></form>{% endif %}
