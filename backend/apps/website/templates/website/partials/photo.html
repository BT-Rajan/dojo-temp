{% load elite %}{% if rendition %}<div class="ea-photo has-img {{ cls }}" style="--ar:{{ ratio }}"><img src="{{ rendition.url }}" width="{{ rendition.width }}" height="{{ rendition.height }}" alt="{{ alt }}" loading="lazy" decoding="async"></div>{% else %}<div class="ea-photo {{ cls }}" style="--ar:{{ ratio }}" role="img" aria-label="{{ caption }}"><span class="ea-photo-cap">{% icon "photo" %}{{ caption }}</span></div>{% endif %}
